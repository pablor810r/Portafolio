<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PABLOR/BLOR - Video Portafolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0e27;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
        }
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            background-size: cover;
            background-position: center;
        }
        .slide.active {
            opacity: 1;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .content {
            text-align: center;
            z-index: 10;
        }
        .content h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }
        .content p {
            font-size: 2rem;
            color: #00f2ff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }
        .counter {
            position: fixed;
            top: 40px;
            right: 40px;
            font-size: 1.5rem;
            color: #00f2ff;
            z-index: 20;
        }
        .progress {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 4px;
            background: #00f2ff;
            width: 0%;
            transition: width 0.1s linear;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="slide active" id="slide-0" style="background-image: url('images/arte_urbano/mural_simbolo_ancestral_2024.jpg');">
            <div class="overlay">
                <div class="content">
                    <h1>PABLOR / BLOR</h1>
                    <p>Arte Urbano • Muralismo</p>
                </div>
            </div>
        </div>
        
        <div class="slide" id="slide-1" style="background-image: url('images/digital/predigital_guardian_semilla.jpg');">
            <div class="overlay">
                <div class="content">
                    <h1>Arte Digital</h1>
                    <p>Técnica & Tecnología</p>
                </div>
            </div>
        </div>
        
        <div class="slide" id="slide-2" style="background-image: url('images/plastica/estudio_pintura_oleo_napoleon_cruzando_los_alpes.jpg');">
            <div class="overlay">
                <div class="content">
                    <h1>Plástica</h1>
                    <p>Pintura • Dibujo • Escultura</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="counter"><span id="current">1</span> / 3</div>
    <div class="progress" id="progress"></div>
    
    <script>
        const slides = document.querySelectorAll('.slide');
        const SLIDE_DURATION = 40000; // 40 segundos por slide
        let currentSlide = 0;
        let startTime = Date.now();
        
        function updateSlides() {
            const elapsed = Date.now() - startTime;
            const progress = (elapsed % (SLIDE_DURATION * slides.length)) / (SLIDE_DURATION * slides.length) * 100;
            
            document.getElementById('progress').style.width = progress + '%';
            
            const newSlide = Math.floor((elapsed / SLIDE_DURATION) % slides.length);
            
            if (newSlide !== currentSlide) {
                slides[currentSlide].classList.remove('active');
                slides[newSlide].classList.add('active');
                document.getElementById('current').textContent = newSlide + 1;
                currentSlide = newSlide;
            }
            
            requestAnimationFrame(updateSlides);
        }
        
        updateSlides();
    </script>
</body>
</html>
